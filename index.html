<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Snipx</title>
        <link rel="icon" href="favicon-dark.png" type="image/png">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet"> 
</head>
    <body>
        <center>
            <div class="bar">
                <div class="red-dot"></div>
                <div class="yellow-dot"></div>
                <div class="green-dot"></div>
                <div class="top-header">
                    <img class="head-logo" src="favicon-dark.png" alt="Snipx Logo">
                    <p class="head-title">Codes<b style="font-weight: 600;">play</b></p>
                </div>
            </div>
        </center>
        <center>
            <div class="codearea">
                <div class="entercode">
                    <div class="entercode-name">
                        <img class="entercode-name-logo" src="code-icon.png" alt="Snipx Logo">
                        <p class="entercode-name-text">Code.txt</p>
                    </div>
                    <textarea class="entercode-input" placeholder="Enter your code here..."></textarea>
                </div>
            </div>
        </center>
    </body>
</html>
